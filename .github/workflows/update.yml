name: Update House Database

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt

      - name: Collect
        run: |
          python collector.py

      - name: Import
        run: |
          python import_houses.py

      - name: Commit
        run: |
          git config user.name "House Tracker Bot"
          git config user.email "actions@github.com"

          git add data/houses.csv houses.db

          git diff --cached --quiet || \
          git commit -m "Auto update house listings"

          git push
