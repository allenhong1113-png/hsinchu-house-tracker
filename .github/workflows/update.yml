name: Update House Database

on:
  workflow_dispatch:
    inputs:
      live_refresh:
        description: "Attempt public-source refresh only where access is permitted (hosted runner returned 403)"
        type: boolean
        default: false
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"

permissions:
  contents: write

concurrency:
  group: house-database-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Collect public HTML (no API key)
        id: collect
        if: github.event_name == 'workflow_dispatch' && inputs.live_refresh
        continue-on-error: true
        run: python collector.py
      - name: Report blocked refresh honestly
        if: steps.collect.outcome != 'success'
        run: |
          echo "::warning::Live refresh disabled or failed. Testing the last genuinely collected snapshot; this run did not obtain new listings."
          echo "Live refresh disabled or failed; last collected snapshot remains available. See last_collection_attempt.json." >> "$GITHUB_STEP_SUMMARY"
      - name: Import last successful snapshot with verified provenance
        run: python import_houses.py
      - name: Parser, database and Streamlit integration tests
        run: python -m pytest -q
      - name: Save diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-report
          path: |
            data/collection_report.json
            data/last_collection_attempt.json
      - name: Commit collected data only after tests pass
        run: |
          git config user.name "House Tracker Bot"
          git config user.email "actions@github.com"
          git add data/houses.csv data/collection_report.json data/last_collection_attempt.json houses.db
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh public listings with collection provenance"
            git push
          fi
